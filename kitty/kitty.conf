# === Fuente ===
font_family      JetBrainsMono Nerd Font
font_size        12.0
bold_font        auto
italic_font      auto
bold_italic_font auto

# === Shell ===
shell /usr/bin/zsh

# === Ventana ===
window_padding_width 14
background_opacity 0.72
dynamic_background_opacity yes
confirm_os_window_close 0
hide_window_decorations yes

# === Cursor ===
cursor_shape       beam
cursor_blink_interval 0.5

# === Scrollback ===
scrollback_lines 10000

# === Paleta Niebla (grises fríos del wallpaper + rojo apagado) ===
foreground  #e4e6e7
background  #141516
cursor      #e4e6e7
cursor_text_color #141516

# Selección
selection_foreground #141516
selection_background #c8ccd0

# URL
url_color #8b98a6

# === Colores del terminal (16 colores) ===
# negro
color0  #1c1d1f
color8  #4a4d50
# rojo (acento: las flores del cementerio)
color1  #b8656a
color9  #c98287
# verde musgo
color2  #92a48e
color10 #a9b9a5
# amarillo hueso
color3  #c4b49a
color11 #d6c9b2
# azul acero
color4  #8b98a6
color12 #a7b4c1
# magenta ceniza
color5  #a395a6
color13 #b8acbb
# cyan niebla
color6  #8fa6ad
color14 #a7bbc1
# blanco
color7  #c8ccd0
color15 #f4f5f6

# === Tabs (minimal, sin powerline) ===
tab_bar_edge bottom
tab_bar_style separator
tab_separator "  "
tab_title_template " {title} "
active_tab_foreground   #f4f5f6
active_tab_background   #2a2c2e
active_tab_font_style   normal
inactive_tab_foreground #6f7376
inactive_tab_background #141516
tab_bar_background      #141516
allow_remote_control yes
