env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Tema unificado Qt + cursor
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

# SSH: agente gcr-ssh-agent (gnome-keyring); passphrases en el llavero de login
env = SSH_AUTH_SOCK,/run/user/1000/gcr/ssh
env = SSH_ASKPASS,/usr/lib/gcr4-ssh-askpass
env = SSH_ASKPASS_REQUIRE,prefer

monitor=DP-1,1920x1080@239.96,0x0,1

$terminal = kitty
$menu = wofi --show drun

exec-once = waybar

input {
    kb_layout = es
    follow_mouse = 1
}

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    # Borde de cristal: filo de luz sutil, como las ventanas de macOS
    col.active_border = rgba(ffffff38)
    col.inactive_border = rgba(ffffff12)
}

# ===== Tema Niebla · glassmorphism estilo Apple =====
decoration {
    rounding = 14
    rounding_power = 3.0        # esquinas "squircle" (curvatura continua de Apple)
    active_opacity = 1.0
    inactive_opacity = 0.96
    dim_inactive = true
    dim_strength = 0.06

    blur {
        enabled = true
        size = 9
        passes = 3
        noise = 0.015
        contrast = 0.95
        brightness = 0.82
        vibrancy = 0.18
        vibrancy_darkness = 0.2
        popups = true
        xray = false
    }

    shadow {
        enabled = true
        range = 28
        render_power = 3
        offset = 0 8
        color = rgba(00000070)
        color_inactive = rgba(00000040)
    }
}

# Cristal también en barra, lanzador y notificaciones (capas layer-shell)
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.2, match:namespace waybar
layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0.2, match:namespace wofi
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.2, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.2, match:namespace swaync-notification-window

animations {
    enabled = true
    # Curvas tipo iOS/macOS: arranque rápido, frenada larga y suave
    bezier = apple, 0.32, 0.72, 0, 1
    bezier = appleOut, 0.4, 0, 0.6, 1
    animation = windows, 1, 5, apple, popin 92%
    animation = windowsOut, 1, 4, appleOut, popin 92%
    animation = border, 1, 6, default
    animation = fade, 1, 5, apple
    animation = layers, 1, 4, apple, fade
    animation = workspaces, 1, 5, apple, slidefade 12%
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0c0d0e)
}

$mainMod = SUPER
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, R, exec, $menu
bind = $mainMod, V, togglefloating
bind = $mainMod, F, fullscreen

# Ignorar peticiones de "maximizar" de las apps (kitty 0.49 las manda al abrirse
# y desde Hyprland 0.56 se respetan → la ventana nueva tapaba a las demás)
windowrule = suppress_event maximize, match:class .*

# Paneles de cristal (scripts/panel.sh + gestores de audio/bluetooth): flotan centrados
windowrule = float on, match:class ^(float-.+|org\.pulseaudio\.pavucontrol|\.?blueman-manager.*)$
windowrule = size 960 620, match:class ^(float-.+|org\.pulseaudio\.pavucontrol|\.?blueman-manager.*)$
windowrule = center on, match:class ^(float-.+|org\.pulseaudio\.pavucontrol|\.?blueman-manager.*)$

# ===== Un escritorio por tipo de app =====
# 1 = Beacon Split + terminales · 2 = Chrome · 3 = Thunderbird · 4 = todo lo demás.
windowrule = workspace 1, match:class ^(beacon-split|kitty)$
windowrule = workspace 2, match:class ^(google-chrome)$
windowrule = workspace 3, match:class ^(org\.mozilla\.Thunderbird)$
# El resto al 4, salvo lo que debe abrirse donde estés: los paneles flotantes
# (float-*, *-flotante), los desplegables de pyprland (scratch-*), gestores de
# audio/bluetooth, diálogos de contraseña y de archivos, swappy y el cuentagotas.
windowrule = workspace 4, match:class negative:^(beacon-split|kitty|google-chrome|org\.mozilla\.Thunderbird|float-.*|scratch-.*|.*-flotante|org\.pulseaudio\.pavucontrol|\.?blueman-manager.*|xdg-desktop-portal.*|.*askpass.*|.*polkit.*|[Pp]inentry.*|swappy|hyprpicker|)$

# Gestor de archivos y diálogos de archivo con un punto de cristal
windowrule = opacity 0.94 0.88, match:class ^(thunar|Thunar|xdg-desktop-portal-gtk|org\.mozilla\.Thunderbird)$

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
exec-once = hyprpaper & sleep 2 && hyprctl hyprpaper wallpaper "DP-1,/home/eya/.config/wallpapers/angel-roma.jpg"
bind = $mainMod, L, exec, hyprlock
exec-once = hypridle
# Cargar claves SSH al iniciar sesión (ksshaskpass las saca del llavero, sin teclear)
exec-once = /home/eya/.ssh/load-keys.sh

# Mantiene vivo el portapapeles aunque se cierre la app que copió (p. ej. swappy):
# en Wayland el portapapeles lo sirve el proceso que copió; sin esto, al cerrar
# swappy tras darle a "copiar" el contenido se perdía.
exec-once = wl-clip-persist --clipboard regular

# Historial de portapapeles: vigila copias y las guarda en cliphist
exec-once = wl-paste --watch cliphist store

# ===== Capturas de pantalla =====
# Región -> abre swappy para anotar/recortar y luego guardar o copiar
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
# Pantalla completa directa al portapapeles
bind = , Print, exec, grim - | wl-copy

# ===== Portapapeles (historial) =====
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ===== Cuentagotas de color (copia el color al portapapeles) =====
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# ===== Notas rápidas =====
bind = $mainMod, N, exec, /home/eya/.config/hypr/scripts/notas.sh

# ===== Guía de atajos =====
bind = $mainMod SHIFT, H, exec, /home/eya/.local/bin/teclas

# ===== Terminal desplegable (pyprland, estilo Quake) =====
exec-once = pypr
bind = $mainMod, T, exec, /home/eya/.config/hypr/scripts/pypr-toggle.sh term

# ===== Claude Code desplegable =====
bind = $mainMod, A, exec, /home/eya/.config/hypr/scripts/pypr-toggle.sh claude

# ===== Modo Gaming (cierra apps/servidores y libera recursos) =====
bind = $mainMod, G, exec, /home/eya/.config/hypr/scripts/gaming-mode.sh

# ===== Cerrar app del todo (mata el proceso, no solo la ventana) =====
bind = $mainMod SHIFT, Q, exec, /home/eya/.config/hypr/scripts/force-quit.sh

# ===== Reiniciar Waybar (cuando se bugea/peta) =====
bind = $mainMod SHIFT, W, exec, killall -q waybar; sleep 0.3; waybar & disown

# ===== Automontaje de USB/discos (icono en la bandeja de waybar) =====
exec-once = udiskie --tray

# ===== Mover la ventana de sitio dentro del workspace =====
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ===== Redimensionar la ventana activa (mantén pulsado para repetir) =====
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# ===== Teclas multimedia =====
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
