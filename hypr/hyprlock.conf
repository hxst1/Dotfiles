# ===== hyprlock · tema Niebla — estilo pantalla de bloqueo de macOS =====
# Fecha arriba, hora grande y fina, contraseña en una cápsula de cristal abajo.

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
}

background {
    monitor =
    path = /home/eya/.config/wallpapers/angel-roma.jpg
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 0.95
    brightness = 0.55
    vibrancy = 0.15
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] LC_TIME=es_ES.UTF-8 date +"%A, %-d de %B"
    font_size = 20
    font_family = Inter Medium
    color = rgba(228, 230, 231, 0.85)
    position = 0, -150
    halign = center
    valign = top
}

# Hora grande y fina
label {
    monitor =
    text = $TIME
    font_size = 120
    font_family = Inter Display SemiBold
    color = rgba(244, 245, 246, 0.92)
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, -190
    halign = center
    valign = top
}

# Usuario
label {
    monitor =
    text = $USER
    font_size = 14
    font_family = Inter SemiBold
    color = rgba(244, 245, 246, 0.9)
    position = 0, 150
    halign = center
    valign = bottom
}

# Contraseña: cápsula de cristal
input-field {
    monitor =
    size = 240, 40
    rounding = -1
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.14)
    inner_color = rgba(255, 255, 255, 0.10)
    font_color = rgba(244, 245, 246, 1.0)
    font_family = Inter
    fade_on_empty = false
    placeholder_text = <span foreground="##c8ccd0">Introduce la contraseña</span>
    hide_input = false
    check_color = rgba(200, 204, 208, 0.35)
    fail_color = rgba(184, 101, 106, 0.55)
    fail_text = <i>Contraseña incorrecta</i>
    capslock_color = rgba(196, 180, 154, 0.5)
    position = 0, 90
    halign = center
    valign = bottom
}

# Pista inferior
label {
    monitor =
    text = Pulsa Enter para desbloquear
    font_size = 10
    font_family = Inter
    color = rgba(200, 204, 208, 0.45)
    position = 0, 40
    halign = center
    valign = bottom
}
